# Apache zaten 80/443'ü kullanıyorsa: uygulamayı alan adının kökünde (http://saha.ornek.com/) açmak için.
# 1) Modüller:   sudo a2enmod proxy proxy_http headers && sudo systemctl reload apache2
# 2) Bu dosyayı: /etc/apache2/sites-available/saha-kenari.conf olarak kaydedip
#                sudo a2ensite saha-kenari && sudo systemctl reload apache2
# 3) Sunucuyu:   PORT=8080 HOST=127.0.0.1 ANTRENOR_SIFRESI='...' node server.js
# 4) HTTPS:      sudo certbot --apache -d saha.ornek.com
<VirtualHost *:80>
    ServerName saha.ornek.com

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/ timeout=3600
    ProxyPassReverse / http://127.0.0.1:8080/
    RequestHeader set X-Forwarded-Proto "http"

    # canlı güncellemeler (TV yayını, anlık eşitleme) sıkıştırılıp bekletilmesin
    SetEnvIf Request_URI "api/olaylar" no-gzip=1
</VirtualHost>

# Alan adının kökü başka bir sitedeyse uygulamayı alt klasörde de açabilirsiniz (http://ornek.com/saha/):
#   ProxyPass        /saha/ http://127.0.0.1:8080/ timeout=3600
#   ProxyPassReverse /saha/ http://127.0.0.1:8080/
