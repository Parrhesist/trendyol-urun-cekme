# Alan adı ve HTTPS için nginx örneği (sertifika: sudo certbot --nginx -d saha.ornek.com)
# Sunucuyu nginx arkasında şöyle başlatın: PORT=8080 HOST=127.0.0.1 ANTRENOR_SIFRESI='...' node server.js
server {
    listen 80;
    server_name saha.ornek.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # canlı güncellemeler (TV yayını, anlık eşitleme) için tampon kapalı, bağlantı uzun ömürlü
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        client_max_body_size 4m;
    }
}
