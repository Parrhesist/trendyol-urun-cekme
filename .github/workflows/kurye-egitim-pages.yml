# Kurye Sürüş Akademisi'ni GitHub Pages'te yayınlar (telefona kurulabilir, internetsiz çalışır).
# Bir kez yapılması gereken: depo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Kurye eğitim · GitHub Pages

on:
  push:
    branches: [main]
    paths: ['kurye-egitim/**', '.github/workflows/kurye-egitim-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kurye-egitim-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kurye-egitim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kurye-egitim/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: rm dist/artifact.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: kurye-egitim/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
